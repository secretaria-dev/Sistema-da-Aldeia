<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alunos - Sistema Aldeia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sistema Aldeia</h1>
        <p>Gestão de Alunos</p>
    </header>

    <main class="container">

        <h2>Alunos</h2>

        <div class="menu">

            <button onclick="window.location.href='novo-aluno.html'">
                ➕ Novo Aluno
            </button>

            <button onclick="document.getElementById('arquivoExcel').click()">
                📥 Importar Planilha
            </button>

            <button onclick="excluirSelecionados()">
                🗑️ Excluir Selecionados
            </button>

            <button onclick="excluirAlunosGrupo()">
                🗑️ Excluir Alunos de um Grupo
            </button>

            <button onclick="excluirTodosAlunos()">
                ⚠️ Excluir Todos os Alunos
            </button>

            <button onclick="window.location.href='index.html'">
                🔙 Voltar ao Menu
            </button>

        </div>

        <br>

        <input
            type="file"
            id="arquivoExcel"
            accept=".xlsx,.xls,.csv"
            style="display: none;"
        >

        <div class="card">

            <h3>🔎 Pesquisar Aluno</h3>

            <input
                type="text"
                id="pesquisaAluno"
                placeholder="Digite nome, CPF ou grupo..."
            >

        </div>

        <div class="card">

            <h3>👥 Total de Alunos</h3>

            <p id="totalAlunos">
                0 alunos cadastrados
            </p>

        </div>

        <h2>Alunos Cadastrados</h2>

        <div id="listaAlunos">

            <div class="card">

                <h3>Nenhum aluno carregado</h3>

                <p>
                    Cadastre um aluno ou importe uma planilha.
                </p>

            </div>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="alunos.js"></script>

</body>
<script>

    // ==========================================
    // PROTEÇÃO - ALUNOS
    // SOMENTE ADMINISTRADOR
    // ==========================================

    const usuarioLogado =
        localStorage.getItem("usuarioLogado");

    const dadosUsuario =
        JSON.parse(
            localStorage.getItem("dadosUsuario")
        );


    // ==========================================
    // VERIFICAR LOGIN
    // ==========================================

    if (!usuarioLogado || !dadosUsuario) {

        window.location.replace(
            "login.html"
        );

    }


    // ==========================================
    // VERIFICAR PERMISSÃO
    // ==========================================

    if (
        dadosUsuario &&
        dadosUsuario.tipo !== "administrador"
    ) {

        alert(
            "⛔ Acesso restrito ao administrador."
        );

        window.location.replace(
            "index.html"
        );

    }

</script>

</html>
